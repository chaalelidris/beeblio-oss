services:
  beeblio-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dependencies
    container_name: beeblio-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - BEEBLIO_UI_HOST=0.0.0.0
      - PORT=3000
      - BEEBLIO_DATA_DIR=/app/.beeblio
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - /app/.output
      - beeblio_dev_data:/app/.beeblio
    command: ["pnpm", "dev"]

volumes:
  beeblio_dev_data:
    name: beeblio_dev_data
